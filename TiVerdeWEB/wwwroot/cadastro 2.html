<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - TI VERDE SPA</title>
    <link rel="stylesheet" href="style3.css">
</head>

<body>

	<header>
		
		<h1>Cadastro - TI VERDE</h1>

		<nav>
			<a href="index 2.html" data-page="inicio">Início</a>
			<a href="projetos 2.html" data-page="projetos">Projetos</a>
			<a href="cadastro 2.html" data-page="cadastro">Cadastro</a>
		</nav>
		
	</header>

    <p>Faça seu cadastro para participar de nossas iniciativas.</p>

    <main>

			<div class="alerta">
				<strong>Atenção:</strong> confira os dados antes de enviar.
			</div>

    <form>

   <fieldset>

         <legend>Dados pessoais</legend>
	   
		<div class="dados">
			
          <div class="campo">
			
         <label for="nome">Nome:</label>
         <input type="text" id="nome" name="nome" required>
			 
			 </div>
			
			<div class="campo">

         <label for="email">Email:</label>
         <input type="email" id="email" name="email" required>
			 
			 </div>
			
			<div class="campo">

         <label for="telefone">Telefone:</label>
         <input type="tel" id="telefone" name="telefone"
			pattern="(?:\(?([1-9]{2})\)?)?(?:[2-8]|9[0-9])[0-9]{3}\-?[0-9]{4}"
            placeholder="(11) 91234-5678"
            title="Digite um telefone válido com DDD. Exemplos: (11) 91234-5678,
            11912345678 ou 11 3333-4444" required>
			 
			 </div>
			
			<div class="campo">
			 
		 <label for="cpf">CPF:</label>
		 <input type="text" id="cpf" name="cpf"
				pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
				placeholder="000.000.000-00"
				title="Digite um CPF válido. Exemplo: 123.456.789-00" required>
			 
			 </div>
			</div>

    </fieldset>

    <fieldset>

         <legend>Endereço</legend>
		
		<div class="dados">
			 
			 <div class="campo">

         <label for="endereco">Endereço:</label>
         <input type="text" id="endereco" name="endereco" required>
			 
			 </div>
			
			<div class="campo">

			 <label for="estado">Estado:</label>

			 <select id="estado" name="estado" required>

				 <option value="">Selecione</option>
				 <option value="go">Goiás</option>
				 <option value="df">Distrito Federal</option>
				 <option value="sp">São Paulo</option>
				 <option value="mg">Minas Gerais</option>

			 </select>
				
				</div>
			
			    <div class="campo">
			 
			 <label for="cidade">Cidade:</label>
			 
			 <select id="cidade" name="cidade" required>

				 <option value="">Selecione</option>
				 <option value="goiania">Goiânia</option>
				 <option value="brasilia">Brasília</option>
				 <option value="sao_paulo">São Paulo</option>
				 <option value="belo_horizonte">Belo Horizonte</option>

			 </select>
					
					</div>
			
			        <div class="campo">
			 
			 <label for="CEP">CEP:</label>
			 <input type="text" id="CEP" name="CEP"
				 pattern="[0-9]{5}-[0-9]{3}"
				 placeholder="00000-000"
				 title="Digite um CEP válido. Exemplo: 12345-678" required>
				 
				 </div>
			</div>

    </fieldset>

    <fieldset>

         <legend>Mensagem</legend>
		
		<div class="dados">
			<div class="campo">

         <label for="mensagem">Por que você quer participar?</label>
         <textarea id="mensagem" name="mensagem" rows="4" cols="50" required></textarea>
				
				</div>
			</div>

    </fieldset>

		<fieldset>
			<legend>Interesse em nossos projetos</legend>
			
			<div class="dados">
				
				<div class="campo">

			<label for="voluntario">Quero ser voluntário</label>
			<input type="checkbox" id="voluntario" name="voluntario">

				</div>
					
					<div class="campo">

					<label for="doacao">Quero realizar uma doação</label>
					<input type="checkbox" id="doacao" name="doacao">

					</div>
					
				</div>

    </fieldset>

		<button type="button" onclick="mostrarToast()">Enviar</button>
</form>

    </main>

	<div id="toast" class="toast">
		Cadastro realizado com sucesso!
	</div>

	<script>
	const toast = document.getElementById("toast");

	function mostrarToast() {
	toast.style.display = "block";

	setTimeout(function() {
	toast.style.display = "none";
	}, 3000);
	}
	</script>

	<script type="module" src="js/app.js"></script>

</body>
</html>
